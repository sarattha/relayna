site_name: Relayna Ecosystem
site_description: Architecture, quickstart, and deployment profiles for Relayna
site_url: https://relayna.github.io/relayna/
repo_url: https://github.com/Relayna/relayna
repo_name: Relayna/relayna
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logos/mark-light.svg
  favicon: assets/brand/logos/mark-light.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Deployment profiles: deployment-profiles.md
  - Component directory: components.md
  - Releases and migration: releases.md
  - Roadmap: roadmap.md
plugins:
  - search
  - redirects:
      redirect_maps:
        getting-started.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/getting-started.md
        spooltail.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/spooltail.md
        studio-backend.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-backend.md
        studio-persistence.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-persistence.md
        studio-observability-profiles.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-observability-profiles.md
        studio-frontend.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-frontend.md
        studio-recovery-center.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-recovery-center.md
        studio-reliability.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-reliability.md
        studio-load-testing.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-load-testing.md
        studio-entra-auth.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-entra-auth.md
        studio-entra-deployment-checklist.md: https://github.com/Relayna/relayna-studio/blob/main/docs/studio-entra-deployment-checklist.md
        redis-topologies.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/redis-topologies.md
        redis-keys.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/redis-keys.md
        migration-v1-to-v2.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/migration-v1-to-v2.md
        json-transport-migration.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/json-transport-migration.md
        runtime-controls.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/runtime-controls.md
        observability.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/observability.md
        aks-observability.md: https://github.com/Relayna/relayna-studio/blob/main/docs/aks-observability.md
        execution-graphs.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/execution-graphs.md
        workflow-topology-plan.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/workflow-topology-plan.md
        development.md: https://github.com/Relayna/relayna-sdk/blob/main/docs/development.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.3/dist/mermaid.min.js
  - assets/mermaid-init.js
extra_css:
  - assets/stylesheets/extra.css
