site_name: relayna
site_description: Public documentation for relayna
site_url: https://sarattha.github.io/relayna/
repo_url: https://github.com/sarattha/relayna
repo_name: sarattha/relayna
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logos/mark-light.svg
  favicon: assets/brand/logos/mark-light.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Studio Backend: studio-backend.md
  - Studio Persistence: studio-persistence.md
  - Studio Frontend: studio-frontend.md
  - Studio Recovery Center: studio-recovery-center.md
  - Studio Reliability Goals: studio-reliability.md
  - Studio Load Testing: studio-load-testing.md
  - Studio Entra Authentication: studio-entra-auth.md
  - Studio Entra Deployment Checklist: studio-entra-deployment-checklist.md
  - Redis Topologies: redis-topologies.md
  - Redis Keys: redis-keys.md
  - Migration v1 to v2: migration-v1-to-v2.md
  - JSON Transport Migration: json-transport-migration.md
  - Components: components.md
  - Runtime Controls: runtime-controls.md
  - Observability: observability.md
  - AKS Observability: aks-observability.md
  - Execution Graphs: execution-graphs.md
  - Workflow Topology: workflow-topology-plan.md
  - Releases: releases.md
  - Development: development.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js
extra_css:
  - assets/stylesheets/extra.css
