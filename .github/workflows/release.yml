name: Release

on:
  push:
    tags:
      - "v*"
      - "sdk-v*"
      - "studio-v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release metadata and notes
        id: release
        run: |
          python3 scripts/validate-release-metadata.py "$RELEASE_TAG" \
            --notes-out release-notes.md --github-output "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        if: steps.release.outputs.sdk == 'true'
        run: uv sync --extra dev

      - name: Run SDK tests
        if: steps.release.outputs.sdk == 'true'
        run: uv run pytest tests -q

      - name: Sync Studio backend dependencies
        if: steps.release.outputs.studio == 'true'
        run: make -C studio/backend sync

      - name: Run Studio backend tests
        if: steps.release.outputs.studio == 'true'
        run: make -C studio/backend test

      - name: Build artifacts
        if: steps.release.outputs.sdk == 'true'
        run: uv build

      - name: Validate built distributions
        if: steps.release.outputs.sdk == 'true'
        run: uv run twine check dist/*

      - name: Build and validate the standalone Studio backend wheel
        if: steps.release.outputs.sdk == 'false'
        run: |
          uv build --wheel --out-dir studio-dist studio/backend
          uvx twine@6.2.0 check studio-dist/*

      - name: Attest Studio backend wheel provenance
        if: steps.release.outputs.sdk == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: studio-dist/*.whl

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SDK SBOM
        if: steps.release.outputs.sdk == 'true'
        run: |
          syft dist --output "spdx-json=relayna-sdk-$RELEASE_TAG.spdx.json"

      - name: Attest SDK provenance
        if: steps.release.outputs.sdk == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.studio == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.studio == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up Cosign
        if: steps.release.outputs.studio == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Extract Studio backend Docker metadata
        if: steps.release.outputs.studio == 'true'
        id: studio-backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-backend
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Studio backend Docker image
        if: steps.release.outputs.studio == 'true'
        id: studio-backend-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: studio/backend/Dockerfile
          push: true
          tags: ${{ steps.studio-backend-meta.outputs.tags }}
          labels: ${{ steps.studio-backend-meta.outputs.labels }}
          provenance: true
          sbom: false

      - name: Generate Studio backend image SBOM
        if: steps.release.outputs.studio == 'true'
        run: |
          syft "${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-backend@${{ steps.studio-backend-build.outputs.digest }}" \
            --output "spdx-json=relayna-studio-backend-$RELEASE_TAG.spdx.json"

      - name: Scan Studio backend image with Trivy
        if: steps.release.outputs.studio == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-backend@${{ steps.studio-backend-build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Sign Studio backend image
        if: steps.release.outputs.studio == 'true'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-backend@${{ steps.studio-backend-build.outputs.digest }}"

      - name: Attest Studio backend image provenance
        if: steps.release.outputs.studio == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-backend
          subject-digest: ${{ steps.studio-backend-build.outputs.digest }}
          push-to-registry: true

      - name: Extract Studio frontend Docker metadata
        if: steps.release.outputs.studio == 'true'
        id: studio-frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Studio frontend Docker image
        if: steps.release.outputs.studio == 'true'
        id: studio-frontend-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          push: true
          tags: ${{ steps.studio-frontend-meta.outputs.tags }}
          labels: ${{ steps.studio-frontend-meta.outputs.labels }}
          provenance: true
          sbom: false

      - name: Generate Studio frontend image SBOM
        if: steps.release.outputs.studio == 'true'
        run: |
          syft "${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-frontend@${{ steps.studio-frontend-build.outputs.digest }}" \
            --output "spdx-json=relayna-studio-frontend-$RELEASE_TAG.spdx.json"

      - name: Scan Studio frontend image with Trivy
        if: steps.release.outputs.studio == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-frontend@${{ steps.studio-frontend-build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Sign Studio frontend image
        if: steps.release.outputs.studio == 'true'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-frontend@${{ steps.studio-frontend-build.outputs.digest }}"

      - name: Attest Studio frontend image provenance
        if: steps.release.outputs.studio == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/relayna-studio-frontend
          subject-digest: ${{ steps.studio-frontend-build.outputs.digest }}
          push-to-registry: true

      - name: Select release assets
        id: assets
        env:
          RELEASE_SDK: ${{ steps.release.outputs.sdk }}
          RELEASE_STUDIO: ${{ steps.release.outputs.studio }}
        run: |
          {
            echo 'paths<<EOF'
            if [ "$RELEASE_SDK" = true ]; then
              printf '%s\n' 'dist/*.tar.gz' 'dist/*.whl' "relayna-sdk-$RELEASE_TAG.spdx.json"
            else
              echo 'studio-dist/*.whl'
            fi
            if [ "$RELEASE_STUDIO" = true ]; then
              printf '%s\n' "relayna-studio-backend-$RELEASE_TAG.spdx.json" "relayna-studio-frontend-$RELEASE_TAG.spdx.json"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: ${{ steps.assets.outputs.paths }}
          fail_on_unmatched_files: true
          make_latest: ${{ steps.release.outputs.sdk == 'true' && steps.release.outputs.studio == 'true' && 'true' || 'false' }}
