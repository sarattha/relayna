x-redis-stack: &redis-stack
  image: redis/redis-stack-server:7.4.0-v8
  restart: "no"

services:
  standalone:
    <<: *redis-stack
    profiles: [standalone]
    ports:
      - "16379:6379"
    environment:
      REDIS_ARGS: "--appendonly no --save ''"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30

  primary:
    <<: *redis-stack
    profiles: [replication]
    ports:
      - "16380:6379"
    environment:
      REDIS_ARGS: "--appendonly no --save ''"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30

  replica-1:
    <<: *redis-stack
    profiles: [replication]
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "16381:6379"
    environment:
      REDIS_ARGS: "--replicaof primary 6379 --appendonly no --save ''"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30

  replica-2:
    <<: *redis-stack
    profiles: [replication]
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "16382:6379"
    environment:
      REDIS_ARGS: "--replicaof primary 6379 --appendonly no --save ''"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30

  cluster-1:
    <<: *redis-stack
    profiles: [cluster]
    ports: ["17001:17001", "27001:27001"]
    environment:
      REDIS_ARGS: "--port 17001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no --save '' --protected-mode no --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname --cluster-announce-port 17001 --cluster-announce-bus-port 27001"
    healthcheck:
      test: [CMD, redis-cli, -p, "17001", ping]
      interval: 1s
      timeout: 1s
      retries: 30

  cluster-2:
